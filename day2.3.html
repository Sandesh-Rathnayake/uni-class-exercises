<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>
    
    <h1 style="color: navy; text-align: center;">Student Registration Form</h1>

    <div style="background-color: darkgray; padding: 20px; width: 400px; margin: 0 auto;">

        <form action="#" method="post">

            <label for="name">Student Name:</label>
            <input type="text" id="name" name="name"><br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age"><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label><br><br>

            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="IT">Information Technology</option>
                <option value="CS">Computer Science</option>
                <option value="DS">Data Science</option>
                <option value="SE">Software Engineering</option>
            </select><br><br>

            <label>Skills:</label><br>
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label><br>
            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label><br>
            <input type="checkbox" id="js" name="skills" value="JavaScript">
            <label for="js">JavaScript</label><br>
            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label><br><br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="30"></textarea><br><br>

            <button type="submit" style="background-color: green; color: white; padding: 8px 16px; border: none;">Submit</button>
            <button type="reset" style="background-color: gray; color: white; padding: 8px 16px; border: none;">Reset</button>
